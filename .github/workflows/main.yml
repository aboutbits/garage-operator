name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, reopened, synchronize ]

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  lint:
    name: Lint Markdown
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
        with:
          config: .rumdl.toml
          report-type: annotations
